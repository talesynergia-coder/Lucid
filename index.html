<style>/* LUCID design system — premium photographic equipment meets creative software. Photos dominate; chrome recedes. */
:root{--bg:#050505;--s1:#0b0b0c;--s2:#121213;--s3:#1a1a1c;--s4:#232326;--line:#2a2a2e;--line2:#37373c;--text:#f2f0ec;--mute:#9a9aa0;--dim:#66666c;--accent:#d8a548;--danger:#e5675f;--ok:#7bc58a;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--nav:72px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none;font-variant-numeric:tabular-nums}
body{overflow:hidden;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px;letter-spacing:-.02em}h2{font-size:17px}h3{font-size:14px;letter-spacing:.02em;margin:18px 0 10px}
p{margin:0 0 10px}.muted{color:var(--mute)}.small{font-size:12px}.hidden,[hidden]{display:none!important}.grow{flex:1;min-width:0}
::selection{background:var(--accent);color:#000}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.scroll-x::-webkit-scrollbar{display:none}
/* shell */
#app{position:fixed;inset:0;display:grid;grid-template-columns:calc(var(--nav) + var(--sal)) 1fr;grid-template-rows:100%}
.nav{display:flex;flex-direction:column;align-items:stretch;padding:calc(var(--sat) + 14px) 0 calc(var(--sab) + 10px) var(--sal);background:var(--s1);border-right:1px solid var(--line);z-index:30}
.brand{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:18px;font-size:9.5px;letter-spacing:.34em;font-weight:700;color:var(--mute)}
.brand i{width:26px;height:26px;border-radius:50%;border:2px solid #c9ccd1;position:relative}.brand i:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--accent)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0;color:var(--dim);position:relative;transition:color .15s}
.nav-btn .ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.nav-btn .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.nav-btn.on{color:var(--text)}.nav-btn.on:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--accent);border-radius:2px}
.nav-btn:hover{color:var(--mute)}.nav-btn.on:hover{color:var(--text)}
.main{position:relative;min-width:0;min-height:0;height:100%}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 18px) calc(var(--sar) + 24px) 32px 24px;-webkit-overflow-scrolling:touch}
body[data-section=capture] .screen,body[data-section=edit] .screen{padding:0;overflow:hidden}
@media (max-width:899px),(orientation:portrait) and (max-width:1100px){
 #app{grid-template-columns:1fr;grid-template-rows:1fr calc(58px + var(--sab))}
 .nav{flex-direction:row;order:2;padding:0 var(--sar) var(--sab) var(--sal);border-right:0;border-top:1px solid var(--line);justify-content:space-around}
 .brand{display:none}.nav-btn{flex:1;padding:8px 0 6px;gap:3px}.nav-btn.on:before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:2px}
 .nav-btn .ico svg{width:22px;height:22px}.nav-btn .lab{font-size:9.5px}
 .screen{padding:calc(var(--sat) + 14px) calc(var(--sar) + 14px) 24px calc(var(--sal) + 14px)}
}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;min-height:36px;border:1px solid var(--line2);border-radius:8px;background:var(--s3);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
